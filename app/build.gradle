name: Build XLS Viewer APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Generate Project Files
        shell: python
        run: |
          import os, pathlib

          os.makedirs("app/src/main/java/com/example/xlsviewer", exist_ok=True)
          os.makedirs("app/src/main/res/layout", exist_ok=True)

          pathlib.Path("settings.gradle.kts").write_text('''
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "SimpleXlsViewer"
          include(":app")
          '''.strip())

          pathlib.Path("build.gradle.kts").write_text('''
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          '''.strip())

          pathlib.Path("gradle.properties").write_text('''
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx3072m
          '''.strip())

          pathlib.Path("app/build.gradle.kts").write_text('''
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.example.xlsviewer"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.xlsviewer"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
              packaging {
                  resources {
                      excludes += "/META-INF/{AL2.0,LGPL2.1}"
                      excludes += "META-INF/DEPENDENCIES"
                      excludes += "META-INF/LICENSE*"
                      excludes += "META-INF/NOTICE*"
                  }
              }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.appcompat:appcompat:1.6.1")
              implementation("com.google.android.material:material:1.11.0")
              implementation("org.apache.poi:poi:5.2.5")
              implementation("org.apache.poi:poi-ooxml:5.2.5")
          }
          '''.strip())

          pathlib.Path("app/src/main/AndroidManifest.xml").write_text('''
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="true"
                  android:label="Simple XLS Viewer"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.MaterialComponents.DayNight.DarkActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="content" />
                          <data android:scheme="file" />
                          <data android:mimeType="application/vnd.ms-excel" />
                          <data android:mimeType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.SEND" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <data android:mimeType="application/vnd.ms-excel" />
                          <data android:mimeType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <data android:scheme="content" />
                          <data android:scheme="file" />
                          <data android:mimeType="application/octet-stream" />
                          <data android:pathPattern=".*\\.xls" />
                          <data android:pathPattern=".*\\.xlsx" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          '''.strip())

          pathlib.Path("app/src/main/res/layout/activity_main.xml").write_text('''
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:padding="12dp">

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="horizontal"
                  android:gravity="center_vertical"
                  android:paddingBottom="8dp">

                  <Button
                      android:id="@+id/btnOpenFile"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="Open XLS File" />

                  <TextView
                      android:id="@+id/tvStatus"
                      android:layout_width="0dp"
                      android:layout_height="wrap_content"
                      android:layout_weight="1"
                      android:layout_marginStart="12dp"
                      android:text="Select a file or open from email"
                      android:textSize="14sp"
                      android:ellipsize="end"
                      android:maxLines="2" />
              </LinearLayout>

              <ProgressBar
                  android:id="@+id/progressBar"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_gravity="center"
                  android:visibility="gone" />

              <ScrollView
                  android:layout_width="match_parent"
                  android:layout_height="0dp"
                  android:layout_weight="1"
                  android:fillViewport="true">

                  <HorizontalScrollView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content">

                      <TableLayout
                          android:id="@+id/tableLayout"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:background="#CCCCCC" />

                  </HorizontalScrollView>
              </ScrollView>
          </LinearLayout>
          '''.strip())

          pathlib.Path("app/src/main/java/com/example/xlsviewer/MainActivity.kt").write_text('''
          package com.example.xlsviewer

          import android.content.Intent
          import android.graphics.Color
          import android.graphics.Typeface
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.view.Gravity
          import android.view.View
          import android.widget.*
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AppCompatActivity
          import org.apache.poi.ss.usermodel.DataFormatter
          import org.apache.poi.ss.usermodel.WorkbookFactory
          import kotlin.concurrent.thread

          class MainActivity : AppCompatActivity() {

              private lateinit var tableLayout: TableLayout
              private lateinit var tvStatus: TextView
              private lateinit var progressBar: ProgressBar

              private val openDocumentLauncher = registerForActivityResult(
                  ActivityResultContracts.OpenDocument()
              ) { uri: Uri? ->
                  uri?.let { loadExcelFile(it) }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  tableLayout = findViewById(R.id.tableLayout)
                  tvStatus = findViewById(R.id.tvStatus)
                  progressBar = findViewById(R.id.progressBar)
                  val btnOpenFile: Button = findViewById(R.id.btnOpenFile)

                  btnOpenFile.setOnClickListener {
                      openDocumentLauncher.launch(
                          arrayOf(
                              "application/vnd.ms-excel",
                              "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",
                              "application/octet-stream"
                          )
                      )
                  }

                  handleIncomingIntent(intent)
              }

              override fun onNewIntent(intent: Intent?) {
                  super.onNewIntent(intent)
                  intent?.let { handleIncomingIntent(it) }
              }

              private fun handleIncomingIntent(intent: Intent) {
                  val uri: Uri? = when (intent.action) {
                      Intent.ACTION_VIEW -> intent.data
                      Intent.ACTION_SEND -> {
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                              intent.getParcelableExtra(Intent.EXTRA_STREAM, Uri::class.java)
                          } else {
                              @Suppress("DEPRECATION")
                              intent.getParcelableExtra(Intent.EXTRA_STREAM)
                          }
                      }
                      else -> null
                  }

                  if (uri != null) {
                      loadExcelFile(uri)
                  }
              }

              private fun loadExcelFile(uri: Uri) {
                  progressBar.visibility = View.VISIBLE
                  tvStatus.text = "Loading spreadsheet..."
                  tableLayout.removeAllViews()

                  thread {
                      try {
                          contentResolver.openInputStream(uri)?.use { inputStream ->
                              val workbook = WorkbookFactory.create(inputStream)
                              val sheet = workbook.getSheetAt(0)
                              val formatter = DataFormatter()
                              val parsedRows = mutableListOf<List<String>>()

                              var maxCols = 0
                              for (row in sheet) {
                                  val lastCell = row.lastCellNum.toInt()
                                  if (lastCell > maxCols) maxCols = lastCell
                              }

                              for (r in 0..sheet.lastRowNum) {
                                  val row = sheet.getRow(r)
                                  val rowData = mutableListOf<String>()
                                  for (c in 0 until maxCols) {
                                      val cell = row?.getCell(c)
                                      rowData.add(if (cell != null) formatter.formatCellValue(cell) else "")
                                  }
                                  parsedRows.add(rowData)
                              }

                              val sheetName = sheet.sheetName
                              workbook.close()

                              runOnUiThread {
                                  progressBar.visibility = View.GONE
                                  tvStatus.text = "Sheet: $sheetName (${parsedRows.size} rows)"
                                  renderTable(parsedRows)
                              }
                          }
                      } catch (e: Exception) {
                          e.printStackTrace()
                          runOnUiThread {
                              progressBar.visibility = View.GONE
                              tvStatus.text = "Error reading file: ${e.localizedMessage}"
                              Toast.makeText(this, "Could not parse XLS file", Toast.LENGTH_LONG).show()
                          }
                      }
                  }
              }

              private fun renderTable(rows: List<List<String>>) {
                  tableLayout.removeAllViews()

                  for ((rowIndex, rowData) in rows.withIndex()) {
                      val tableRow = TableRow(this)

                      for (cellText in rowData) {
                          val tv = TextView(this).apply {
                              text = cellText
                              setPadding(24, 16, 24, 16)
                              setTextColor(Color.BLACK)
                              gravity = Gravity.START or Gravity.CENTER_VERTICAL
                              
                              if (rowIndex == 0) {
                                  setBackgroundColor(Color.parseColor("#E8EAF6"))
                                  setTypeface(null, Typeface.BOLD)
                              } else {
                                  setBackgroundColor(Color.WHITE)
                              }

                              layoutParams = TableRow.LayoutParams(
                                  TableRow.LayoutParams.WRAP_CONTENT,
                                  TableRow.LayoutParams.MATCH_PARENT
                              ).apply {
                                  setMargins(1, 1, 1, 1)
                              }
                          }
                          tableRow.addView(tv)
                      }
                      tableLayout.addView(tableRow)
                  }
              }
          }
          '''.strip())

      - name: Compile Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload Compiled APK
        uses: actions/upload-artifact@v4
        with:
          name: SimpleXlsViewer-APK
          path: app/build/outputs/apk/debug/app-debug.apk
